name: Continuous Delivery

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Étape 0 : Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape 1 : Installer k3s
      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | sh -
          sudo cp /etc/rancher/k3s/k3s.yaml $HOME/.kube/config
          sudo chown $(id -u):$(id -g) $HOME/.kube/config

      # Étape 2 : Vérifier le cluster
      - name: Check cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      # Étape 3 : Déploiement Kubernetes
      - name: Deploy to Kubernetes
        run: |
          cat <<EOF > k8s-deployment.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: gotn-deployment
            labels:
              app: gotn
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: gotn
            template:
              metadata:
                labels:
                  app: gotn
              spec:
                containers:
                  - name: gotn
                    image: gotn:${{ github.sha }}
                    ports:
                      - containerPort: 8000
          EOF

          cat <<EOF > k8s-service.yaml
          apiVersion: v1
          kind: Service
          metadata:
            name: gotn-service
          spec:
            selector:
              app: gotn
            ports:
              - protocol: TCP
                port: 80
                targetPort: 8000
            type: LoadBalancer
          EOF

          kubectl apply -f k8s-deployment.yaml
          kubectl apply -f k8s-service.yaml
